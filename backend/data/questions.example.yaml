# Banco de preguntas para generar el banco de respuestas (M2) y para las
# sesiones de Practice Mode (M3).
#
# Esta es la version en blanco (sin datos personales) — las preguntas en
# si son genericas y reutilizables. Copia este archivo a questions.yaml y
# llena el campo hint con tus propias historias/proyectos.
#
# Campos:
#   id       — identificador estable, se usa como nombre de archivo en data/answers/
#   category — una de las categorias listadas en el plan
#   question_en — la pregunta tal como la haria el entrevistador
#   hint     — (opcional) que historia(s)/proyecto(s)/gap conviene usar; guia a generate.py

