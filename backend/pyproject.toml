[project]
name = "asistente-entrevistas"
version = "0.1.0"
description = "Asistente de práctica y traducción para entrevistas de trabajo en inglés"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "RealtimeSTT>=0.3.104",
    "faster-whisper>=1.0",
    "PyAudioWPatch>=0.2.12.7",
    "sentence-transformers>=3.3",
    "anthropic>=0.40",
    "openai>=1.54",
    "edge-tts>=6.1",
    "argostranslate>=1.9",
    "silero-vad>=5.1",
    "langdetect>=1.0.9",
    "pyyaml>=6.0",
    "numpy>=1.26,<2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
